name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < packaging/VERSION)"
          echo "tag=${tag} VERSION=${file}"
          if [ "${tag}" != "${file}" ]; then
            echo "::error::tag ${tag} does not match VERSION ${file}"
            exit 1
          fi

      - name: Build .deb (produces dist/coldspot_<version>_all.deb + dist/SHA256SUMS)
        run: make deb

      - name: Build release tarball, fold into the unified manifest
        run: |
          # .gitattributes export-ignore keeps CI/dev files out of the tarball.
          git archive --format=tar.gz --prefix=coldspot/ -o coldspot.tar.gz HEAD
          debfile="dist/coldspot_$(tr -d '[:space:]' < packaging/VERSION)_all.deb"
          cp "${debfile}" .
          cp dist/SHA256SUMS .
          sha256sum coldspot.tar.gz >> SHA256SUMS
          # Retained for one release cycle (0.6.0 only, dropped at 0.7.0 --
          # see docs/CHANGELOG.md): the family's artifact-shape unification
          # (ruling 0d38a1f9) moves the signed manifest to SHA256SUMS,
          # matching byebyte/RAMstein/kast/phanspeed; this single-purpose
          # file lets any install.sh checkout that predates the fallback
          # (added below) keep resolving against the SAME bytes/format it
          # always has -- awk '$2 == "coldspot.tar.gz"' against a one-line
          # "<hash>  <filename>" file, unchanged.
          sha256sum coldspot.tar.gz > coldspot.tar.gz.sha256
          echo "--- contents (tarball) ---"
          tar -tzf coldspot.tar.gz
          echo "--- manifest (one signature covers every artifact it lists) ---"
          cat SHA256SUMS

      # No signing step here, deliberately: install.sh's bootstrap trusts an
      # SSH signature (ssh-keygen -Y verify) against a key pinned INSIDE the
      # client (packaging/release-signing/allowed_signers, docs/RELEASE-SIGNING.md),
      # precisely so that this CI (or the GitHub account behind it) is not the
      # trust root. A secret/hardware key living in Actions secrets would let
      # anyone who compromises the account or the workflow sign whatever they
      # just pushed — that defeats the entire scheme. The release ships
      # UNSIGNED from here; the operator signs the published SHA256SUMS bytes
      # BY HAND, offline, with the physical FIDO2 key, and runs `gh release
      # upload <tag> SHA256SUMS.sig --clobber` after (SHA256SUMS is now the
      # primary signed manifest, matching byebyte/RAMstein/kast/phanspeed;
      # see the comment above coldspot.tar.gz.sha256's generation).

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unsigned assets only. install.sh's bootstrap fails closed until
          # the operator uploads a detached signature out of band (see
          # comment above).
          debfile="dist/coldspot_$(tr -d '[:space:]' < packaging/VERSION)_all.deb"
          assets=("$(basename "${debfile}")" coldspot.tar.gz SHA256SUMS coldspot.tar.gz.sha256)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            # Notes come from CHANGELOG.md, never --generate-notes: a human
            # wrote that entry, and a commit dump is not release notes. If the
            # section is missing, refuse the release instead of falling back,
            # so a forgotten CHANGELOG entry is loud rather than silent.
            ver="${GITHUB_REF_NAME#v}"
            awk -v v="${ver}" 'BEGIN{f=0}
              /^## / { if (f) exit; if (index($0, v)) { f=1; print; next } }
              f { print }' docs/CHANGELOG.md > RELEASE_NOTES.md
            if [ ! -s RELEASE_NOTES.md ]; then
              echo "::error::no docs/CHANGELOG.md section for ${ver}; add one before tagging"
              exit 1
            fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "coldspot ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi
