name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < packaging/VERSION)"
          echo "tag=${tag} VERSION=${file}"
          if [ "${tag}" != "${file}" ]; then
            echo "::error::tag ${tag} does not match VERSION ${file}"
            exit 1
          fi

      - name: Build release tarball
        run: |
          # .gitattributes export-ignore keeps CI/dev files out of the tarball.
          git archive --format=tar.gz --prefix=coldspot/ -o coldspot.tar.gz HEAD
          sha256sum coldspot.tar.gz > coldspot.tar.gz.sha256
          echo "--- contents ---"
          tar -tzf coldspot.tar.gz

      # No signing step here, deliberately: coldspot-update trusts an SSH
      # signature (ssh-keygen -Y verify) against a key pinned INSIDE the
      # client (release-signing/allowed_signers, docs/RELEASE-SIGNING.md),
      # precisely so that this CI (or the GitHub account behind it) is not the
      # trust root. A secret/hardware key living in Actions secrets would let
      # anyone who compromises the account or the workflow sign whatever they
      # just pushed — that defeats the entire scheme. The release ships
      # UNSIGNED from here; the operator signs the checksum manifest's exact
      # published bytes BY HAND, offline, with the physical FIDO2 key, and runs
      # `gh release upload <tag> coldspot.tar.gz.sha256.sig --clobber` after.

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unsigned assets only. auto-update fails closed until the operator
          # uploads a detached signature out of band (see comment above).
          assets=(coldspot.tar.gz coldspot.tar.gz.sha256)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            # Notes come from CHANGELOG.md, never --generate-notes: a human
            # wrote that entry, and a commit dump is not release notes. If the
            # section is missing, refuse the release instead of falling back,
            # so a forgotten CHANGELOG entry is loud rather than silent.
            ver="${GITHUB_REF_NAME#v}"
            awk -v v="${ver}" 'BEGIN{f=0}
              /^## / { if (f) exit; if (index($0, v)) { f=1; print; next } }
              f { print }' CHANGELOG.md > RELEASE_NOTES.md
            if [ ! -s RELEASE_NOTES.md ]; then
              echo "::error::no CHANGELOG.md section for ${ver}; add one before tagging"
              exit 1
            fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "coldspot ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi
