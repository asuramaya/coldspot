name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${tag} VERSION=${file}"
          if [ "${tag}" != "${file}" ]; then
            echo "::error::tag ${tag} does not match VERSION ${file}"
            exit 1
          fi

      - name: Build release tarball
        run: |
          # .gitattributes export-ignore keeps CI/dev files out of the tarball.
          git archive --format=tar.gz --prefix=coldspot/ -o coldspot.tar.gz HEAD
          sha256sum coldspot.tar.gz > coldspot.tar.gz.sha256
          echo "--- contents ---"
          tar -tzf coldspot.tar.gz

      # No signing step here, deliberately: coldspot-update trusts a detached
      # signature verified against a key pinned INSIDE the client, precisely so
      # that this CI (or the GitHub account behind it) is not the trust root.
      # A secret key living in Actions secrets would let anyone who compromises
      # the account or the workflow sign whatever they just pushed — that
      # defeats the entire scheme. The release ships UNSIGNED from here; the
      # operator signs these exact published bytes BY HAND, offline, and runs
      # `gh release upload <tag> coldspot.tar.gz.minisig --clobber` afterward.

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unsigned assets only. auto-update fails closed until the operator
          # uploads a detached signature out of band (see comment above).
          assets=(coldspot.tar.gz coldspot.tar.gz.sha256)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "coldspot ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
