name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # First, before anything below can create a build/dist artifact that
      # would otherwise trip the row-count check for the wrong reason
      # (REPO-STANDARD.md: order the structure gate before any build step,
      # not just exclude gitignored paths from the count).
      - name: Repo structure gate (REPO-STANDARD.md)
        run: make check-repo

      # Calls into the Makefile rather than hand-copying its file list and
      # exclusions: a list duplicated into ci.yml drifts silently the moment
      # someone adds a file to one side and not the other (phanspeed's CI
      # was red for five straight commits from exactly this).
      - name: ShellCheck + ruff
        run: make lint

      - name: Python (syntax)
        run: make pycheck

      - name: Sutra vendor drift guard
        run: make check-sutra

      - name: GNOME extension (syntax)
        run: node --check "src/extension/coldspot@asuramaya/extension.js"

      - name: GNOME extension metadata (valid JSON)
        run: python3 -c "import json; json.load(open('src/extension/coldspot@asuramaya/metadata.json'))"

      - name: man page (syntax)
        # -t -k, not just -Tutf8 -ww: the bare form exits 0 while silently
        # skipping the table and UTF-8 preprocessor passes, so a malformed
        # table would render clean. Family-wide hardening (Alfred, msg 1628).
        run: groff -t -k -man -Tutf8 -ww src/data/man/man1/coldspot.1 src/data/man/man8/coldspotd.8 > /dev/null

      - name: Unit + contract tests
        run: python3 tests/test_units.py

      - name: Release-signing verify path
        run: bash tests/test_signing.sh

      - name: Daemon smoke test
        run: bash tests/smoke.sh

      - name: Control socket fuzz (adversarial, no root)
        run: python3 tests/attack_socket.py
